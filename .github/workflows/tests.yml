name: tests

# Runs the local (scheduler-free) tier of the self-test suite on GitHub-hosted
# runners. This mode stubs `module`/`qsub` and runs the Nextflow pipeline with
# --executor local, so it needs no Lmod and no SGE -- see tests/README.md.
# The integration tier (real Lmod + SGE) can only run on the SCC and is not run here.

on:
  push:
    branches: [ main ]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      # find_qsub.py runs `module show ... |& xargs ...` via Python's shell=True,
      # which uses /bin/sh. On the SCC /bin/sh is bash, but on ubuntu it's dash,
      # which does not support the `|&` bashism. Point /bin/sh at bash to match.
      - name: Use bash as /bin/sh
        run: sudo ln -sf /bin/bash /bin/sh

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python deps (find_qsub.py imports; pytest runs the suite)
        run: python -m pip install --upgrade pip pytest tqdm

      - name: Set up Java (for Nextflow)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Nextflow
        run: |
          curl -s https://get.nextflow.io | bash
          sudo mv nextflow /usr/local/bin/
          nextflow -version

      # pkgtest.nf's runTests process runs `beforeScript 'source $HOME/.bashrc'`.
      # Ensure the file exists so sourcing it does not fail on the runner.
      - name: Ensure ~/.bashrc exists
        run: touch "$HOME/.bashrc"

      - name: Run local self-tests
        run: bash tests/run_local.sh -v --junitxml=tests/results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: tests/results.xml
